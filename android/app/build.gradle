plugins { id 'com.android.application' }
android {
 buildFeatures { buildConfig true }
 namespace 'com.bplus.player'
 compileSdk 36
 defaultConfig { applicationId 'com.bplus.player'; minSdk 31; targetSdk 35; versionCode 12; versionName '1.0.12' }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "512m"; forkEvery = 1; systemProperty 'bplus.renderDir', System.getProperty('bplus.renderDir', layout.buildDirectory.dir('ui-renders').get().asFile.absolutePath) } }
 buildTypes { release { minifyEnabled false; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'androidx.media3:media3-exoplayer:1.11.1'; implementation 'androidx.media3:media3-ui:1.11.1'; implementation 'androidx.media3:media3-session:1.11.1'; implementation 'androidx.media3:media3-effect:1.11.1' }
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

dependencies { testImplementation 'org.robolectric:robolectric:4.16.1'; testImplementation 'androidx.test:core:1.6.1' }
